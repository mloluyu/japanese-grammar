name: 提交新语法建议
description: 建议新增或修订一条日语语法
title: "[语法建议] "
labels: ["content"]
body:
  - type: input
    id: expression
    attributes:
      label: 语法表达
      description: 例如 〜ことになる
      placeholder: 语法名称
    validations:
      required: true
  - type: dropdown
    id: jlpt
    attributes:
      label: JLPT 等级（暂定）
      options:
        - N5
        - N4
        - N3
        - N2
        - N1
        - 不确定
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议内容
      description: 可填写含义、接续、例句、疑问或修订建议
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 参考来源与版权说明
      description: 请注明参考资料；不要粘贴未经许可的教材或题库内容
    validations:
      required: false
