name: CI

# 仅在 PR 时运行：直接推送到 main 不触发远程构建，
# 站点效果以本地 `npm run docs:dev` / `npm run docs:build` 验证为主。
on:
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run check

      - name: Build site
        run: npm run docs:build
